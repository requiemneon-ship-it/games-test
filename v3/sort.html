<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1530">
<title>Разложи всё</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f0b1c; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, "Segoe UI", sans-serif; color: #fff; }
  #stage { position: fixed; top: 0; bottom: 0; left: 50%; width: min(100vw, 62vh); transform: translateX(-50%);
    overflow: hidden; background: #1c1530; }
  canvas { display: block; width: 100%; height: 100%; }
  button { font: inherit; font-weight: 700; color: #fff; border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg,#7c5cff,#ff5c9d); padding: 14px 22px; font-size: 18px; width: 100%; }
  button.alt { background: rgba(255,255,255,.14); }
  button.gold { background: linear-gradient(135deg,#ffb347,#ff7e47); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  #top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 10px) 12px 0;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .chip { background: rgba(255,255,255,.12); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 17px;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .chip button { width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 18px; line-height: 26px;
    background: linear-gradient(135deg,#ffb347,#ff7e47); }
  .sq { width: 42px; padding: 8px 0; font-size: 20px; background: rgba(255,255,255,.12); }
  #prog { position: absolute; left: 14px; right: 14px; top: calc(env(safe-area-inset-top) + 62px); height: 8px; border-radius: 6px;
    background: rgba(255,255,255,.12); overflow: hidden; pointer-events: none; }
  #progFill { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg,#7c5cff,#ff5c9d);
    transition: width .35s cubic-bezier(.2,.9,.3,1.2); }
  #tip { position: absolute; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 76px); text-align: center; font-size: 14px; opacity: .85; pointer-events: none; }
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 0 12px calc(env(safe-area-inset-bottom) + 14px); }
  .tool { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; font-size: 22px; }
  .tool small { font-size: 13px; opacity: .9; }
  #ui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .panel { pointer-events: auto; display: none; flex-direction: column; gap: 12px; align-items: center; text-align: center;
    padding: 24px 26px; border-radius: 22px; background: rgba(20,16,40,.95); min-width: 250px; max-width: 86%; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .panel.show { display: flex; animation: pop .28s cubic-bezier(.2,.9,.3,1.25); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h1 { margin: 0; font-size: 38px; }
  .panel h2 { margin: 0; font-size: 26px; }
  .sub { opacity: .75; font-size: 15px; }
  .big { font-size: 44px; font-weight: 800; }
  #stars { display: flex; gap: 6px; font-size: 46px; line-height: 1; }
  #stars span { color: rgba(255,255,255,.18); transition: color .2s, transform .35s cubic-bezier(.2,1.6,.4,1); transform: scale(.7); }
  #stars span.on { color: #ffd24a; transform: scale(1.12); text-shadow: 0 0 18px rgba(255,210,74,.7); }
  @media (prefers-reduced-motion: reduce) { .panel.show { animation: none; } #progFill { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="top">
    <button class="sq" id="bMenu" title="Menu">☰</button>
    <button class="sq" id="bSound" title="Sound">🔊</button>
    <div class="chip" id="lvl"></div>
    <div class="chip"><span id="coinN">0</span><span>🪙</span><button id="bCoinAd" title="+">+</button></div>
  </div>
  <div id="prog"><i id="progFill"></i></div>
  <div id="tip"></div>
  <div id="bottom">
    <button class="tool" id="bUndo">↶<small id="cUndo"></small></button>
    <button class="tool" id="bHint">💡<small id="cHint"></small></button>
    <button class="tool" id="bExtra">➕<small id="cExtra"></small></button>
  </div>
  <div id="ui">
    <div class="panel" id="pWin">
      <h2 data-i18n="win">Уровень пройден!</h2>
      <div id="stars"><span>★</span><span>★</span><span>★</span></div>
      <div class="sub" id="winMoves"></div>
      <div class="big" id="winCoins">+10 🪙</div>
      <div class="sub" id="winExtra" style="line-height:1.5"></div>
      <button class="gold" id="bTriple"></button>
      <button class="alt" id="bReplay"></button>
      <button id="bNext" data-i18n="next">Дальше</button>
    </div>
    <div class="panel" id="pStuck">
      <h2 data-i18n="stuck">Нет ходов</h2>
      <div class="sub" data-i18n="stuckHint">Отмените ход или начните заново</div>
      <button id="bStuckUndo"></button>
      <button class="alt" id="bStuckRestart" data-i18n="restart">Заново</button>
    </div>
    <div class="panel" id="pCoins">
      <h2 data-i18n="noCoins">Не хватает монет</h2>
      <button class="gold" id="bGetCoins"></button>
      <button class="alt" id="bCloseCoins" data-i18n="close">Закрыть</button>
    </div>
  </div>
</div>

<script>window.PlatformConfig = { demo: true };</script>
<script>
/* Общий слой для казуальных прототипов: хранилище, тексты (ru/en), звук, монеты и ежедневный бонус, реклама и покупка.
   Подключается тегом <script> до кода игры. Реальная реклама/покупки приходят из моста платформы
   (src/yandex-bridge.js для Яндекс Игр): window.NativeAds / window.NativeBilling / window.PlatformHooks.
   В обычном браузере реклама и покупка имитируются, чтобы игры можно было отлаживать без SDK. */
(function (global) {
  'use strict';
  const PH = global.PlatformHooks || {};
  const PCFG = global.PlatformConfig || {};
  const call = (fn, ...a) => { try { return fn && fn(...a); } catch (e) {} };

  /* ---------- Хранилище (localStorage с префиксом игры) ---------- */
  let GAME_ID = 'game';
  const DEMO = !!PCFG.demo;                       // тестовая веб-версия: без покупок (в ней нельзя показывать confirm)
  const mem = {};                                  // запасное хранилище, если localStorage недоступен (приватное окно и т.п.)
  const store = {
    get(k, d) {
      const key = GAME_ID + ':' + k;
      try { const v = localStorage.getItem(key); if (v !== null) return JSON.parse(v); } catch (e) {}
      return key in mem ? mem[key] : d;
    },
    set(k, v) { const key = GAME_ID + ':' + k; mem[key] = v; try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} },
  };

  /* ---------- Тексты ---------- */
  const dict = { ru: {}, en: {} };
  let lang = 'ru';
  const t = (k, ...a) => {
    let s = (dict[lang] && dict[lang][k]) ?? (dict.ru && dict.ru[k]) ?? k;
    a.forEach((v, i) => { s = s.replace('{' + i + '}', v); });
    return s;
  };
  function setStrings(s) { for (const l of Object.keys(s)) dict[l] = Object.assign(dict[l] || {}, s[l]); }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    if (dict[lang] && dict[lang].title) document.title = dict[lang].title;
  }
  function setLang(l) {
    lang = dict[l] ? l : (String(l).toLowerCase().startsWith('ru') ? 'ru' : 'en');
    applyI18n();
    if (api.onLang) api.onLang(lang);
  }

  /* ---------- Звук ---------- */
  const Snd = (() => {
    let ctx = null, master = null;
    const s = { muted: false, userMuted: false };     // muted — временно (реклама), userMuted — выбор игрока, хранится между запусками
    function ensure() {
      ctx = ctx || new (global.AudioContext || global.webkitAudioContext)();
      if (!master) {                                  // мягкий компрессор, чтобы наложение звуков не клипало
        master = ctx.createGain(); master.gain.value = .9;
        const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
      }
    }
    function beep(freq, dur, type = 'sine', vol = .15, delay = 0, endFreq = 0) {
      if (s.muted || s.userMuted || document.hidden) return;
      try {
        ensure();
        const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + delay;
        o.type = type; o.frequency.setValueAtTime(freq, t0);
        if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
        o.connect(g); g.connect(master);
        g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .008); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
        o.start(t0); o.stop(t0 + dur + .02);
      } catch (e) {}
    }
    const semi = n => Math.pow(2, n / 12);
    s.tap = () => beep(660, .05, 'triangle', .1);
    s.select = () => { beep(700, .07, 'triangle', .12); beep(990, .08, 'sine', .08, .04); };
    s.move = () => beep(300, .14, 'sine', .14, 0, 520);                 // короткий «свист» вверх
    s.land = () => beep(190, .12, 'sine', .22, 0, 90);                  // мягкий «тук»
    s.slide = () => beep(240, .1, 'triangle', .1, 0, 340);
    // «Сбор»: аккорд, который с каждым комбо звучит выше (n — номер комбо, до 7 полутонов)
    s.clear = (n = 0) => { const k = semi(Math.min(n, 7)); [523, 659, 784].forEach((f, i) => beep(f * k, .22, 'sine', .15, i * .06)); beep(1046 * k, .3, 'triangle', .07, .18); };
    s.star = (i = 0) => { beep(880 * semi(i * 4), .35, 'sine', .16); beep(1760 * semi(i * 4), .3, 'triangle', .05, .02); };
    s.win = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .22, 'sine', .17, i * .1));
    s.fail = () => beep(220, .3, 'sawtooth', .08, 0, 110);
    s.coin = () => { beep(900, .08, 'square', .06); beep(1200, .12, 'square', .06, .07); };
    s.toggle = () => { s.userMuted = !s.userMuted; store.set('muted', s.userMuted); return s.userMuted; };
    s.suspend = () => { try { ctx && ctx.suspend(); } catch (e) {} };
    s.resume = () => { try { ctx && !s.muted && !s.userMuted && ctx.resume(); } catch (e) {} };
    return s;
  })();
  const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Snd.suspend(); call(PH.gameplayStop); }
    else { Snd.resume(); if (api.playing) call(PH.gameplayStart); }
  });
  addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- Всплывающие сообщения ---------- */
  let toastEl = null, toastTimer = 0;
  function toast(text, ms = 1400) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:30;max-width:80vw;text-align:center;' +
        'background:rgba(20,18,43,.92);color:#fff;font:700 18px system-ui,sans-serif;padding:10px 18px;border-radius:14px;' +
        'pointer-events:none;opacity:0;transition:opacity .2s';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = text; toastEl.style.opacity = 1;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.style.opacity = 0; }, ms);
  }

  /* ---------- Монеты и ежедневный бонус ---------- */
  const Economy = {
    get coins() { return store.get('coins', 40); },
    add(n) { store.set('coins', Math.max(0, this.coins + n)); if (this.onChange) this.onChange(); },
    spend(n) { if (this.coins < n) return false; this.add(-n); return true; },
    onChange: null,
    /** Начисляет ежедневный бонус, если сегодня ещё не получали. Возвращает { amount, streak } или null. */
    claimDaily() {
      const d = new Date(), key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      const last = store.get('dailyKey', null);
      if (last === key) return null;
      const y = new Date(d.getTime() - 864e5), yKey = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
      const streak = last === yKey ? store.get('streak', 0) + 1 : 1;
      const amount = 30 + 10 * Math.min(streak - 1, 6);
      store.set('dailyKey', key); store.set('streak', streak);
      this.add(amount);
      return { amount, streak };
    },
  };

  /* ---------- Реклама и покупка ---------- */
  let adOverlay = null;
  function fakeAd(cb) {
    if (!adOverlay) {
      adOverlay = document.createElement('div');
      adOverlay.style.cssText = 'position:fixed;inset:0;z-index:50;background:#000d;color:#fff;display:none;align-items:center;' +
        'justify-content:center;flex-direction:column;gap:8px;font:20px system-ui,sans-serif';
      document.body.appendChild(adOverlay);
    }
    let n = 2; adOverlay.style.display = 'flex';
    adOverlay.innerHTML = '<div>' + t('ad') + '</div><div>' + n + '</div>';
    const id = setInterval(() => {
      n--; adOverlay.innerHTML = '<div>' + t('ad') + '</div><div>' + n + '</div>';
      if (n <= 0) { clearInterval(id); adOverlay.style.display = 'none'; cb(true); }
    }, 1000);
  }
  const Monetization = {
    adsRemoved: store.get('noads', false),
    levelsSinceAd: 0,
    EVERY: PCFG.interstitialEvery || 3,
    _set(v) { this.adsRemoved = v; store.set('noads', v); },
    // На время полноэкранной рекламы глушим звук и сообщаем платформе, что геймплей остановлен.
    _wrap(run, cb) {
      Snd.muted = true; call(PH.gameplayStop);
      run((...a) => { Snd.muted = false; if (api.playing) call(PH.gameplayStart); cb(...a); });
    },
    init(onChange) {
      if (global.NativeAds) global.NativeAds.init().then(onChange);
      if (global.NativeBilling) global.NativeBilling.hasRemoveAds().then(owned => {
        if (owned === null || owned === this.adsRemoved) return;
        this._set(owned); if (onChange) onChange();
      });
    },
    /** Реклама за награду. cb(true) — досмотрена; cb(false, 'unavailable') — реклама не загрузилась. */
    rewarded(cb) {
      this._wrap(done => {
        if (global.NativeAds) global.NativeAds.showRewarded().then(r => done(!!r.rewarded, r.reason), () => done(false, 'unavailable'));
        else fakeAd(done);
      }, (ok, reason) => { if (!ok && reason === 'unavailable') toast(t('adUnavailable')); cb(ok); });
    },
    /** Вызывать после каждого пройденного уровня: раз в EVERY уровней показывает межстраничную рекламу. */
    levelDone(done) {
      if (this.adsRemoved || ++this.levelsSinceAd < this.EVERY) return done();
      this.levelsSinceAd = 0;
      this._wrap(end => {
        if (global.NativeAds) global.NativeAds.showInterstitial().then(end, end);
        else fakeAd(() => end());
      }, () => done());
    },
    buyRemoveAds(cb) {
      if (DEMO) { toast(t('demoNoBuy')); return cb(false); }
      if (global.NativeBilling) global.NativeBilling.buyRemoveAds().then(ok => { if (ok) this._set(true); cb(ok); });
      else if (confirm(t('devBuy'))) { this._set(true); cb(true); } else cb(false);
    },
  };

  /* ---------- Мета-слой: темы за звёзды, ежедневный уровень, сундуки, меню ---------- */
  const Meta = (() => {
    const m = { themes: [{ id: 'base', name: { ru: 'Классика', en: 'Classic' }, need: 0, preview: '' }] };
    const day = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
    m.dayNumber = day;
    m.dailyDone = () => store.get('dailyDoneDay', -1) === day();
    m.dailyStreak = () => (store.get('dailyDoneDay', -1) >= day() - 1 ? store.get('dailyStreak', 0) : 0);   // серия сгорает, если пропущен день
    /** Засчитывает ежедневный уровень и возвращает { streak, coins }. */
    m.completeDaily = () => {
      const today = day(), last = store.get('dailyDoneDay', -1);
      const streak = last === today ? Math.max(1, store.get('dailyStreak', 1)) : last === today - 1 ? store.get('dailyStreak', 0) + 1 : 1;
      store.set('dailyDoneDay', today); store.set('dailyStreak', streak);
      return { streak, coins: 30 + 10 * Math.min(streak - 1, 5) };
    };
    m.nameOf = t => t.name[lang] || t.name.ru;
    m.theme = () => { const id = store.get('theme', 'base'); return m.themes.some(t => t.id === id) ? id : 'base'; };
    m.unlocked = (t, total) => total >= t.need;
    m.nextLocked = total => m.themes.filter(t => t.need > total).sort((a, b) => a.need - b.need)[0] || null;
    m.newlyUnlocked = (before, after) => m.themes.filter(t => t.need > before && t.need <= after);
    m.setTheme = (id, total) => { const t = m.themes.find(q => q.id === id); if (!t || !m.unlocked(t, total)) return false; store.set('theme', id); return true; };
    // сундук: каждый 5-й уровень один раз даёт бонус
    m.chestAt = level => level > 0 && level % 5 === 0;
    m.claimChest = level => { const c = store.get('chests', {}); if (c[level]) return 0; c[level] = 1; store.set('chests', c); return 20; };

    let cfg = null, ui = null;
    const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
    /** Создаёт панели «Меню» и «Темы» внутри #ui. o: { themes, getStars, show(id), onTheme(id), onRestart(), onDaily(), onNoAds(), onClose() } */
    m.mount = o => {
      cfg = o; m.themes = o.themes; ui = document.getElementById('ui');
      const menu = mk('div', 'panel'); menu.id = 'pMenu';
      const h1 = mk('h2', '', t('mMenu')); h1.dataset.i18n = 'mMenu'; menu.append(h1);
      const btn = (id, cls) => { const b = mk('button', cls || 'alt'); b.id = id; return b; };
      const bDaily = btn('bDaily', 'gold'), bThemes = btn('bThemes'), bRestart = btn('bRestart2'), bNoAds = btn('bNoAds2'), bClose = btn('bMenuClose');
      menu.append(bDaily, bThemes, bRestart, bNoAds, bClose);
      const th = mk('div', 'panel'); th.id = 'pThemes';
      const h2 = mk('h2', '', t('mThemes')); h2.dataset.i18n = 'mThemes'; th.append(h2);
      const grid = mk('div', ''); grid.id = 'themeGrid'; grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%';
      const bBack = btn('bThemesBack'); th.append(grid, bBack);
      ui.append(menu, th);
      const close = () => { cfg.show(null); cfg.onClose && cfg.onClose(); };
      bDaily.onclick = () => { if (m.dailyDone()) return toast(t('mDailyDone')); cfg.show(null); cfg.onDaily(); };
      bThemes.onclick = () => m.openThemes();
      bRestart.onclick = () => { cfg.show(null); cfg.onRestart(); };
      bNoAds.onclick = () => { Monetization.buyRemoveAds(ok => { m.refresh(); if (ok) toast(t('adsOff')); }); };
      bClose.onclick = close; bBack.onclick = () => m.openMenu();
    };
    m.refresh = () => {
      const streak = m.dailyStreak();
      document.getElementById('bDaily').textContent = m.dailyDone() ? t('mDailyDone') + (streak ? ' · ' + t('mStreak', streak) : '') : t('mDaily') + (streak ? ' · ' + t('mStreak', streak) : '');
      document.getElementById('bThemes').textContent = t('mThemes');
      document.getElementById('bRestart2').textContent = t('mRestart');
      document.getElementById('bMenuClose').textContent = t('mClose');
      document.getElementById('bThemesBack').textContent = t('mBack');
      const na = document.getElementById('bNoAds2'); na.textContent = t('noAds'); na.style.display = (Monetization.adsRemoved || DEMO) ? 'none' : '';
    };
    m.openMenu = () => { m.refresh(); cfg.show('pMenu'); };
    m.openThemes = () => {
      const total = cfg.getStars(), cur = m.theme(), grid = document.getElementById('themeGrid');
      grid.innerHTML = '';
      m.themes.forEach(th => {
        const ok = m.unlocked(th, total), b = mk('button', 'alt');
        b.style.cssText = 'display:flex;flex-direction:column;gap:4px;align-items:center;padding:12px 8px;font-size:15px' + (th.id === cur ? ';outline:3px solid #ffd24a' : '') + (ok ? '' : ';opacity:.55');
        b.innerHTML = '<span style="font-size:24px">' + (th.preview || '') + '</span><b>' + m.nameOf(th) + '</b><small style="font-weight:400">' +
          (th.id === cur ? t('mActive') : ok ? t('mUse') : '🔒 ★ ' + th.need) + '</small>';
        b.onclick = () => { if (!ok) return toast(t('mNeedStars', th.need - total)); if (m.setTheme(th.id, total)) { cfg.onTheme(th.id); m.openThemes(); } };
        grid.append(b);
      });
      m.refresh(); cfg.show('pThemes');
    };
    return m;
  })();

  setStrings({

/* «Полки» — чистая логика (без DOM): состояние, ходы, решатель и генератор уровней.
   Работает и в браузере (глобальный SortLogic), и в Node (module.exports) — на этом держатся автотесты.

   Состояние: { shelves: [ { front: [a, b, c], queue: [[a, b, c], ...] } ] }
   front — три ячейки на виду (-1 = пусто), queue — ряды позади: когда передняя полка опустела, следующий ряд выдвигается вперёд.

(function (root) {
  'use strict';
  const EMPTY = -1;

  function rng(seed) {                        // mulberry32: один и тот же номер уровня всегда даёт один и тот же уровень
    let a = seed >>> 0;

  /** Ритм сложности: каждый 5-й уровень «с характером» (+2 к сложности), следующий за ним — передышка (−2). Так игрок получает и вызов, и лёгкую победу. */

  /** Параметры сложности по номеру уровня (с 1). */

      // падение предметов при старте уровня: по очереди сверху
      const k = (since - (i * 3 + a) * 45) / 380;
      if (k < 1 && !REDUCED) { if (k < 0) continue; dy -= (1 - easeOutBack(k)) * 80; al *= Math.min(1, k * 2); }
      // «сочное» приземление: короткое сжатие-растяжение
      const ld = lands[key]; if (ld && now >= ld && now < ld + 240 && !REDUCED) sc = 1 + .22 * Math.sin(Math.PI * (now - ld) / 240);
      const sel = selected && selected.i === i && selected.a === a;
      if (sel) rot = REDUCED ? 0 : Math.sin(now / 90) * .07;
      const nd = nudge && now - lastInput > 9000 && nudge.i === i && nudge.a === a && Math.sin(now / 160) > 0;
      drawItem(it, p.x, p.y + dy, sz, al, sel ? 10 : 0, sel || nd, rot, sel ? 1.08 : sc);
    }
  });
  // подсказка за монеты: источник и цель
  if (hint && now < hint.until) {
    const pulse = .5 + .5 * Math.sin(now / 120);
    const A = slotPos(lay[hint.i], hint.a), B = slotPos(lay[hint.j], hint.b), sz = lay[hint.i].size;
    g.save(); g.lineWidth = 3 + pulse * 2; g.strokeStyle = '#ffd24a';
    rrect(A.x - sz / 2 - 3, A.y - sz / 2 - 3, sz + 6, sz + 6, sz * .26); g.stroke();
    g.setLineDash([6, 5]); rrect(B.x - sz / 2 - 3, B.y - sz / 2 - 3, sz + 6, sz + 6, sz * .26); g.stroke(); g.restore();
  }
  // подсказка-«рука» на первых уровнях: показывает, куда перенести предмет
  if (tutorial && moves === 0 && !finished && since > 900) {
    const A = slotPos(lay[tutorial.i], tutorial.a), B = slotPos(lay[tutorial.j], tutorial.b);
    const cyc = (now % 2200) / 2200, k = cyc < .15 ? 0 : cyc < .7 ? ease((cyc - .15) / .55) : 1, hx = A.x + (B.x - A.x) * k, hy = A.y + (B.y - A.y) * k;
    g.save(); g.strokeStyle = 'rgba(255,210,74,.9)'; g.lineWidth = 3; g.setLineDash([6, 5]);
    rrect(B.x - lay[tutorial.j].size / 2 - 3, B.y - lay[tutorial.j].size / 2 - 3, lay[tutorial.j].size + 6, lay[tutorial.j].size + 6, 12); g.stroke(); g.restore();
    g.font = '34px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('👆', hx + 6, hy + 22 - (cyc < .15 ? Math.sin(cyc / .15 * Math.PI) * 6 : 0));
  }
  // летящие предметы, всплытия и кольца
  for (let k = anims.length - 1; k >= 0; k--) {
    const an = anims[k], t = (now - an.t0) / an.dur;
    if (t >= 1) { anims.splice(k, 1); continue; }
    if (t < 0) continue;
    if (an.type === 'fly') { const e = ease(t); drawItem(an.item, an.from.x + (an.to.x - an.from.x) * e, an.from.y + (an.to.y - an.from.y) * e - Math.sin(e * Math.PI) * 16, an.size, 1, 0, true, (e - .5) * .25, 1 + .08 * Math.sin(e * Math.PI)); }
    else if (an.type === 'pop') drawItem(an.item, an.x, an.y, an.size * (1 + .55 * Math.sin(t * Math.PI)) * (1 - t * .6), 1 - t);
    else if (an.type === 'ring') { g.save(); g.globalAlpha = (1 - t) * .8; g.strokeStyle = '#fff'; g.lineWidth = 4 * (1 - t) + 1; g.beginPath(); g.arc(an.x, an.y, 10 + t * 70, 0, 6.28); g.stroke(); g.restore(); }
  }
  // частицы
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k]; p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .025;
    if (p.life <= 0) { parts.splice(k, 1); continue; }
    g.globalAlpha = Math.min(1, p.life);
    if (p.g) { g.fillStyle = p.color; g.font = '14px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.g, p.x, p.y); }
    else { g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, 3.2, 0, 6.28); g.fill(); }
    g.globalAlpha = 1;
  }
  g.restore();
  // всплывающие надписи (комбо, бонус)
  for (let k = floats.length - 1; k >= 0; k--) {
    const f = floats[k], t = (now - f.t0) / f.dur;
    if (t >= 1) { floats.splice(k, 1); continue; }
    const pop = t < .15 ? easeOutBack(t / .15) : 1;
    g.save(); g.globalAlpha = t < .7 ? 1 : 1 - (t - .7) / .3; g.translate(f.x, f.y - t * 46); g.scale(pop, pop);
    g.font = `800 ${f.size}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 5; g.strokeStyle = 'rgba(20,10,40,.85)'; g.strokeText(f.text, 0, 0); g.fillStyle = f.color; g.fillText(f.text, 0, 0); g.restore();
  }
  // мягкий намёк при бездействии: считаем ход заранее, показываем лишь пульсацию предмета
  if (!finished && P.playing && now - lastInput > 9000 && nudgeVer !== stateVer) {
    nudgeVer = stateVer; const ep = epoch, snap = SL.clone(state);
    setTimeout(() => { if (ep !== epoch || nudgeVer !== stateVer) return; const sol = SL.solve(snap, 8000); nudge = sol && sol.length ? sol[0] : null; }, 0);
  }
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(stage.clientWidth * dpr); cv.height = Math.round(stage.clientHeight * dpr);
  scale = cv.width / W; H = cv.height / scale;
}
addEventListener('resize', resize); resize();

let firstFrame = true;
function loop(now) {
  requestAnimationFrame(loop);                                   // следующий кадр планируем первым: сбой в draw не должен останавливать игру
  const dpr = window.devicePixelRatio || 1;                      // во встроенных окнах размер сцены может появиться позже первого кадра
  if (cv.width !== Math.round(stage.clientWidth * dpr) || cv.height !== Math.round(stage.clientHeight * dpr)) resize();
  if (!(scale > 0) || !isFinite(H)) return;
  draw(now);
  if (firstFrame) { firstFrame = false; P.ready(); }
}

/* ---------- Старт ---------- */
P.onLang = () => { $('lvl').textContent = mode === 'daily' ? P.t('dailyTag') : P.t('level', level); if (state) refreshHud(); };
P.Meta.mount({
  themes: THEMES, getStars: totalStars, show,
  onTheme: applyTheme, onRestart: restartCurrent, onDaily: () => loadLevel(level, true),
  onClose: () => { if (finished && state) (SL.isWon(state) ? show('pWin') : stuck()); },    // закрыли меню поверх панели победы — вернуть её
});
applyTheme(P.Meta.theme());
loadLevel(level);                                   // игра начинается сразу, без стартового меню
const dailyBonus = P.Economy.claimDaily();
if (dailyBonus) setTimeout(() => P.toast(P.t('daily', dailyBonus.amount) + (dailyBonus.streak > 1 ? ' · ' + P.t('dailyStreak', dailyBonus.streak) : ''), 2600), 500);
P.Monetization.init(refreshHud);
requestAnimationFrame(loop);
</script>
</body>
